# cargo-deny (https://embarkstudios.github.io/cargo-deny/): what may be a
# dependency of gevrek. Run it with `cargo deny check`; CI runs it too.

[graph]
# The systems gevrek is built for, not only the one this runs on.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

# Known faults (RustSec). One that can be exploited always fails; a crate
# nobody maintains fails only where gevrek uses it directly.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
# Each entry needs its reason beside it.
ignore = []

# gevrek is MIT: only licences that leave it so may come in, and MPL-2.0,
# which asks only for its own files' changes.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]

# The fonts egui carries (see THIRD-PARTY-NOTICES.md): font licences, for
# that crate alone.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
# (The crates of this workspace name each other by path.)
wildcards = "allow"

# Crates come from crates.io and nowhere else.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

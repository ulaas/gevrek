[package]
name = "gevrek-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "gevrek's macOS backend: the desktop's windows through the Accessibility API."

[dependencies]
gevrek-model = { path = "../model" }
gevrek-engine = { path = "../engine" }
gevrek-host = { path = "../host" }
anyhow = { workspace = true }
log = { workspace = true }
# The journal of parked windows (`journal.rs`).
serde = { workspace = true }
serde_json = { workspace = true }

# The Accessibility, Core Foundation and Core Graphics calls are declared in
# `src/ffi.rs` (the AX API has no binding among the crates gevrek already
# uses); AppKit, for the screens, through the objc2 crates egui already
# brings on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSEnumerator", "NSString", "NSGeometry", "NSRunLoop", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "objc2-quartz-core"] }
# The borders: windows of gevrek's own, their ring drawn by a layer.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATextLayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor"] }

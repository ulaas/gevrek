[package]
name = "gevrek-shellkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Surfaces for gevrek's shell: a place on the screen (a panel, a launcher, a notification) that egui draws into and that gets input, on each system's own terms."

[dependencies]
egui = "0.37"
egui-wgpu = "0.37"
gevrek-ui = { path = "../ui" }
anyhow = { workspace = true }
log = { workspace = true }
pollster = "1"

# Linux: layer-shell surfaces of a Wayland compositor.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# (And text-input, for input methods in the shell's own text fields.)
# (And what lies behind parts of a surface shown soft: a protocol that is
# still on trial, hence "staging".)
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
# The system's own libwayland, loaded when the program runs: the graphics
# library needs the display and the surface as that library knows them.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
raw-window-handle = "0.6"
# What is drawn, told to screen readers and other aids (AT-SPI): the
# toolkit describes each surface as a tree, and this carries it over.
accesskit_unix = "0.24"

# Windows: borderless tool windows.
[target.'cfg(windows)'.dependencies]
# (Drag and drop: OLE, the data that is dragged, and the memory it is in.)
windows = { workspace = true, features = [
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # (The frame of a window, for what lies behind a surface: look.rs.)
    "Win32_UI_Controls",
] }
# The same crate `windows` is built on, by its own name: the drop target
# and the drag source are written with a macro that names it so.
windows-core = "0.58"
raw-window-handle = "0.6"
# What is drawn, told to screen readers and other aids (UI Automation).
accesskit_windows = "0.35"

# macOS: panels without a frame (AppKit), drawn on with Metal.
[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.27"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSDate", "NSEnumerator", "NSGeometry", "NSObjCRuntime", "NSObject", "NSRange", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColor", "NSCursor", "NSEvent", "NSGraphics", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextInputClient", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[dev-dependencies]
env_logger = { workspace = true }

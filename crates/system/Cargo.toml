[package]
name = "gevrek-system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What gevrek's shell asks of the system it runs on: the installed applications first; icons, sound, brightness, the session as they are needed."

[dependencies]
log = { workspace = true }
dirs = { workspace = true }
# Icons: pictures (PNG) and drawings (SVG).
# (JPEG and WebP: the pictures small pictures of files are made of.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45", default-features = false }
# The zones' backends: the trait they answer, and what passes through it.
gevrek-zones = { path = "../zones" }
gevrek-model = { path = "../model" }
# (What the window manager says of the displays, as the shell has it.)
serde_json = { workspace = true }

# Linux: the sound server, spoken to in its own protocol (PulseAudio's,
# which PipeWire serves too), with no library of C.
[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
# What changes in the folders zones show: the kernel tells (inotify),
# nothing is looked at again and again.
notify = { version = "8", default-features = false }
# The local time a file was put into the trash at, for its record there.
jiff = { workspace = true }

# macOS: the zones are the Unix ones (`zones/linux`) until macOS has its
# own, and need what they need on Linux; the folders are watched by macOS's
# FSEvents.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
jiff = { workspace = true }
# The keys of what plays and of the sound, which only AppKit makes
# (`every_key`).
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry", "NSString", "objc2-core-foundation"] }
# What is copied (`clipboard`).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

# Windows: the Start menu and the shell's pictures of what is in it.
[target.'cfg(windows)'.dependencies]
# (And the network the machine is on: its adapters, and what the system
# calls the network each is connected to.)
windows = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Networking_NetworkListManager",
    # (The wireless radio and the networks in reach.)
    "Win32_NetworkManagement_WiFi",
    # (Bluetooth's radio and the devices the machine knows.)
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    # (What is playing: the sessions players have with the system.)
    "Media_Control",
    "Storage_Streams",
    "Win32_System_IO",
    # (The names of the devices to play on.)
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # (What was copied, for the launcher.)
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # (A window's picture, for the window switcher.)
    "Win32_Storage_Xps",
    # (The zones: the clipboard and what is dragged, as the shell's menus
    # and file operations need them.)
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    # (Who a display is: its EDID, by the device of the display and that
    # device's key.)
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
] }
# The zones: what changes in the folders they show. Windows tells
# (`ReadDirectoryChangesW`); nothing is looked at again and again.
notify = { version = "8", default-features = false }
# (What is written down of Explorer's own icons before they are put away.)
serde = { workspace = true }
# The same crate `windows` is built on, by its own name: what answers the
# system's calls back (the sound's changes) is written with a macro that
# names it so.
windows-core = "0.58"

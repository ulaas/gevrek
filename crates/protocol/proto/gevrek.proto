syntax = "proto3";

package gevrek;

// ============================================================================
// Services
// ============================================================================

service WindowManager {
  // Push a new node graph to the WM for execution
  rpc PushGraph(NodeGraph) returns (PushGraphResponse);

  // Pause execution of the node graph
  rpc PauseExecution(Empty) returns (StatusResponse);

  // Resume execution of the node graph
  rpc ResumeExecution(Empty) returns (StatusResponse);

  // Trigger a manual event node
  rpc TriggerManualEvent(TriggerRequest) returns (StatusResponse);

  // Execute a typed window-manager command
  rpc Dispatch(DispatchRequest) returns (StatusResponse);

  // The same, with the command as the JSON the configuration uses for it
  // (`{"command": "exec", "program": "kitty"}`). A new command needs no
  // change of this protocol: every command a binding can hold can be sent.
  rpc DispatchCommand(CommandDocument) returns (StatusResponse);

  // For automated checks: feed made-up input (a JSON array of steps, see
  // gevrek-host's input_injection) through the window manager's own input
  // path. Refused unless the window manager was started to accept it.
  rpc InjectInput(CommandDocument) returns (StatusResponse);

  // Execute validated typed commands as one uninterrupted runtime batch.
  rpc DispatchBatch(DispatchBatchRequest) returns (DispatchBatchResponse);

  // Query current WM state (workspaces, windows, etc.)
  rpc QueryState(Empty) returns (WMState);

  // Subscribe to execution events (streaming)
  rpc SubscribeToEvents(Empty) returns (stream ExecutionEvent);

  // Health check
  rpc HealthCheck(Empty) returns (HealthStatus);

  // Discover protocol, configuration, dispatcher, node, and feature support.
  rpc GetCapabilities(Empty) returns (CapabilitiesResponse);

  // Get available node definitions (for dynamic editor)
  rpc GetNodeDefinitions(Empty) returns (GetNodeDefinitionsResponse);

  // Get the current active node graph from WM
  rpc GetCurrentGraph(Empty) returns (NodeGraph);

  // Get the complete versioned desktop configuration.
  rpc GetConfiguration(Empty) returns (ConfigurationDocument);

  // Validate, persist, and atomically apply the complete desktop configuration.
  // A document whose `base_revision` is not the running revision is refused
  // (`conflict` in the response): someone else changed the configuration.
  rpc UpdateConfiguration(ConfigurationDocument) returns (UpdateConfigurationResponse);

  // Update the working (collaborative) graph
  rpc UpdateWorkingGraph(NodeGraph) returns (StatusResponse);

  // Get the current working graph (collaborative draft)
  rpc GetWorkingGraph(Empty) returns (NodeGraph);

  // Get overlay/debug data for display
  rpc GetOverlayData(Empty) returns (OverlayDataResponse);

  // Gracefully shutdown the window manager
  rpc Shutdown(ShutdownRequest) returns (StatusResponse);

  // The zones on the desktop live in the shell; this is the shell's line
  // for them. The shell reports how the zones are, what happens to them,
  // and its answers; the window manager sends what is asked of them. One
  // shell is attached at a time (a second is refused while the first is
  // there), and the end of this call is how the window manager knows
  // that the zones are no longer running. Capability: "zones_ipc_v1".
  rpc AttachZones(stream ZonesReport) returns (stream ZonesRequest);

  // How the zones are, as the shell last reported it.
  rpc GetZonesState(ZonesStateRequest) returns (ZonesStateResponse);

  // Ask something of the zones and wait for the shell's answer.
  rpc SendZonesCommand(ZonesCommandDocument) returns (ZonesCommandReply);
}

// Shutdown request with optional parameters
message ShutdownRequest {
  // Whether to save config before shutdown
  bool save_config = 1;
  // Delay in milliseconds before shutdown (allows clients to disconnect)
  uint32 delay_ms = 2;
}

// ============================================================================
// Core Messages
// ============================================================================

message Empty {}

message ConfigurationDocument {
  string json = 1;
  string version = 2;
  // From GetConfiguration: the revision of the running configuration. It
  // increases with every change, whoever makes it (a client, the file
  // watcher, a runtime toggle).
  uint64 revision = 3;
  // For UpdateConfiguration: the revision this document was edited from.
  // 0 applies unconditionally.
  uint64 base_revision = 4;
  // For UpdateConfiguration: who is changing it. Echoed in
  // ConfigurationChanged so a client can ignore its own change.
  string client_id = 5;
}

message UpdateConfigurationResponse {
  bool success = 1;
  optional string error = 2;
  // The running revision: the new one on success, the current one on a
  // conflict.
  uint64 revision = 3;
  // The document was based on an older revision and was not applied.
  bool conflict = 4;
}

// The running configuration changed.
message ConfigurationChanged {
  uint64 revision = 1;
  // The client_id of the UpdateConfiguration that made the change; empty
  // for any other source (file edit, runtime toggle, graph push).
  string origin_client_id = 2;
  int64 timestamp_ms = 3;
}

message StatusResponse {
  bool success = 1;
  optional string error = 2;
}

message PushGraphResponse {
  bool success = 1;
  optional string error = 2;
  uint32 node_count = 3;
  uint32 connection_count = 4;
  // The configuration revision the push produced; when `conflict` is set,
  // the revision the WM runs.
  uint64 revision = 5;
  // Refused: the configuration changed since `base_revision`.
  bool conflict = 6;
}

message TriggerRequest {
  string node_id = 1;
}


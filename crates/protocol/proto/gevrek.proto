// ============================================================================
// Execution Events (for live feedback)
// ============================================================================

message ExecutionEvent {
  oneof event {
    NodeExecutionStarted node_started = 1;
    NodeExecutionCompleted node_completed = 2;
    NodeExecutionFailed node_failed = 3;
    GraphExecutionStarted graph_started = 4;
    GraphExecutionCompleted graph_completed = 5;
    LogEvent log_event = 6;
    WorkingGraphUpdated working_graph_updated = 7;
    RuntimeEvent runtime_event = 8;
    EventsDropped events_dropped = 9;
    ConfigurationChanged configuration_changed = 10;
  }
}

// The subscriber fell behind and `count` events were skipped. The stream
// continues; clients should refetch any state they derive from events.
message EventsDropped {
  uint64 count = 1;
}

message NodeExecutionStarted {
  string node_id = 1;
  NodeType node_type = 2;
  int64 timestamp_ms = 3;
}

message NodeExecutionCompleted {
  string node_id = 1;
  NodeType node_type = 2;
  int64 timestamp_ms = 3;
  int64 duration_ms = 4;
  map<string, string> outputs = 5; // pin_id -> JSON value
}

message NodeExecutionFailed {
  string node_id = 1;
  NodeType node_type = 2;
  int64 timestamp_ms = 3;
  string error = 4;
}

message GraphExecutionStarted {
  string trigger_type = 1; // e.g., "OnStartup", "OnWindowCreated"
  int64 timestamp_ms = 2;
}

message GraphExecutionCompleted {
  string trigger_type = 1;
  int64 timestamp_ms = 2;
  int64 duration_ms = 3;
  uint32 nodes_executed = 4;
}

message LogEvent {
  string message = 1;
  LogLevel level = 2;
  int64 timestamp_ms = 3;
}

message WorkingGraphUpdated {
  int64 timestamp_ms = 1;
  string editor_id = 2; // ID of the editor that made the change
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

// ============================================================================
// WM State
// ============================================================================

message WMState {
  repeated WorkspaceState workspaces = 1;
  repeated WindowInfo windows = 2;
  repeated MonitorInfo monitors = 3;
  optional string active_workspace_id = 4;
  bool execution_paused = 5;
  bool animations_enabled = 6;
  uint32 active_animations = 7;
  uint32 animation_duration_ms = 8;
  string animation_curve = 9;
  bool animate_layout = 10;
  bool animate_workspace = 11;
  bool animate_borders = 12;
  repeated RuleState rules = 13;
  repeated ScratchpadState scratchpads = 14;
  string active_binding_submap = 15;
  bool dim_inactive = 16;
  uint32 inactive_window_opacity = 17;
  bool dim_fullscreen = 18;
  string shadow_policy = 19;
  repeated StartupState startup = 20;
  repeated AnimationChannelState animation_channels = 21;
  GestureState gesture = 22;
  bool tiling_suspended = 23;
  // The desktop is shown: the windows of the shown workspaces are out of
  // sight until it ends (`show_desktop`).
  bool desktop_shown = 24;
}

// Stable external extension event envelope. Event names and field keys are
// versioned through the capabilities feature "extension_events_v1".
message RuntimeEvent {
  string kind = 1;
  int64 timestamp_ms = 2;
  // The window the event is about (the id the WM gave it; not an OS handle).
  optional uint64 window_id = 3;
  map<string, string> fields = 4;
}

message AnimationChannelState {
  string scope = 1;
  bool enabled = 2;
  uint32 duration_ms = 3;
  string curve = 4;
  string enter_style = 5;
  string exit_style = 6;
}

message GestureState {
  bool available = 1;
  string backend = 2;
  uint32 device_count = 3;
  uint32 configured_count = 4;
  optional GestureProgress active = 5;
  optional string last_error = 6;
}

message GestureProgress {
  string phase = 1;
  uint32 fingers = 2;
  optional string direction = 3;
  float progress = 4;
  float delta_x = 5;
  float delta_y = 6;
}

message WorkspaceState {
  string id = 1;
  string name = 2;
  string monitor_id = 3;
  repeated string window_ids = 4;
  string layout_type = 5;
  string dwindle_direction = 6;
  bool dwindle_preserve_split = 7;
  uint32 pseudotiled_windows = 8;
  string master_position = 9;
  string new_window_placement = 10;
  bool tiling_enabled = 11;
  bool float_override = 12;
  // Per-workspace window container behaviour: "Column" or "Append".
  string window_container_behaviour = 13;
  // What is shown of it: its title, or its name where it has none. (`name`
  // is what it is known by to keys, rules and commands, and does not
  // change when it is renamed.)
  string title = 14;
  // The configuration has an entry for it on its display.
  bool configured = 15;
  // It stays when it is left empty.
  bool persistent = 16;
}

message WindowInfo {
  // The id the WM gave the window. It names the window in commands
  // (`handle:<id>` selectors); it is not an OS handle.
  uint64 window_id = 1;
  string title = 2;
  string class = 3;
  string exe = 4;
  Position position = 5;
  Size size = 6;
  bool is_focused = 7;
  bool is_minimized = 8;
  bool is_maximized = 9;
  repeated string tags = 10;
  repeated string matched_rules = 11;
  repeated string effective_rule_effects = 12;
  uint32 effective_opacity = 13;
  bool is_dimmed = 14;
  string shadow_policy = 15;
  // What the program calls itself: the Wayland application id; on Windows
  // the program name without its extension.
  string app_id = 16;
}

message RuleState {
  string name = 1;
  bool enabled = 2;
  bool dynamic = 3;
}

message ScratchpadState {
  string id = 1;
  bool enabled = 2;
  optional uint64 window_id = 3;
  bool visible = 4;
  bool pending_spawn = 5;
}

message StartupState {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  string status = 4;
  optional uint32 pid = 5;
  uint32 restart_count = 6;
  optional int32 last_exit_code = 7;
  optional string last_error = 8;
}

message MonitorInfo {
  // 1 was the id as text; `output_id` replaced it.
  reserved 1;
  string name = 2;
  Position position = 3;
  Size size = 4;
  bool is_primary = 5;
  Position work_position = 6;
  Size work_size = 7;
  int32 reserved_left = 8;
  int32 reserved_top = 9;
  int32 reserved_right = 10;
  int32 reserved_bottom = 11;
  bool is_focused = 12;
  // The id the WM gave the output, and the name of its connector or device.
  uint64 output_id = 13;
  string connector = 14;
  // Who the display is wherever it is plugged in, made of its EDID
  // (`GSM-5B7F-0004E2A1`: maker, product code, serial number);
  // `port:<connector>` for a display without one.
  string stable_id = 15;
  // As in MonitorOverlayData.
  Sides zones_room = 16;
}

// So much at each side of a rectangle, in the units of that rectangle.
message Sides {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

message Size {
  int32 width = 1;
  int32 height = 2;
}

// ============================================================================
// Node Definitions (Server-Defined Nodes)
// ============================================================================

message GetNodeDefinitionsResponse {
  repeated NodeDefinition definitions = 1;
  string version = 2; // WM version providing these definitions
}

message NodeDefinition {
  string type_id = 1;           // Unique identifier (e.g., "OnWindowCreated")
  string display_name = 2;      // UI display name (e.g., "On Window Created")
  string category = 3;          // Category for grouping (e.g., "Events", "Actions")
  string description = 4;       // Help text
  repeated PinDefinition inputs = 5;
  repeated PinDefinition outputs = 6;
  repeated PropertyDefinition properties = 7;
  NodeType legacy_type = 8;    // For backward compatibility with old enum
}

message PinDefinition {
  string name = 1;              // Pin display name (e.g., "Window")
  PinType type = 2;             // Data type
  bool required = 3;            // Whether this pin must be connected
  optional string default_value = 4; // Default value (JSON serialized)
  string description = 5;       // Help text for this pin
}

message PropertyDefinition {
  string key = 1;               // Property key (e.g., "workspace_name")
  PropertyType type = 2;        // Property data type
  string display_name = 3;      // UI label
  optional string default_value = 4;
  string description = 5;
  repeated string enum_values = 6; // For enum/select properties
}

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  STRING_PROPERTY = 1;
  NUMBER_PROPERTY = 2;
  BOOL_PROPERTY = 3;
  ENUM_PROPERTY = 4;           // Select from enum_values
  COLOR_PROPERTY = 5;
  LAYOUT_PROPERTY = 6;
}

// ============================================================================
// Overlay/Debug Data
// ============================================================================

message OverlayDataResponse {
  int64 timestamp_ms = 1;
  repeated MonitorOverlayData monitors = 2;
  uint32 graph_node_count = 3;
  uint32 total_windows = 4;
  double event_loop_fps = 5;
  optional string last_event = 6;
  repeated ScratchpadState scratchpads = 7;
  string active_binding_submap = 8;
  bool dim_inactive = 9;
  uint32 inactive_window_opacity = 10;
  bool dim_fullscreen = 11;
  string shadow_policy = 12;
  repeated StartupState startup = 13;
  GestureState gesture = 14;
  // What the window manager has to tell the person at the machine, for as
  // long as it is so (another program on the same keys, ...).
  repeated Notice notices = 15;
  // The accent the desktop has now where it is not the configuration's
  // own (the wallpaper's colour), as 0xRRGGBB.
  optional uint32 accent_rgb = 16;
  // The keyboard layout in use (where the system tells it).
  optional KeyboardLayoutState keyboard_layout = 17;
  // How the frames of each display got there (a compositor: Linux).
  repeated DisplayFrames frames = 18;
}

// How the frames of a display got there since the window manager started.
message DisplayFrames {
  // The display's name ("DP-1").
  string output = 1;
  // Frames that were a window's own picture, handed to the display as it
  // drew them (a window that covers the display, a game).
  uint64 direct = 2;
  // Frames the window manager drew.
  uint64 composed = 3;
  // The last frame was a window's own picture.
  bool direct_now = 4;
}

message KeyboardLayoutState {
  // As it is written in the configuration ("tr"), or the first letters
  // of its name.
  string short = 1;
  // Its full name ("Turkish").
  string name = 2;
  // Its place among the layouts, from 0, and how many there are.
  uint32 index = 3;
  uint32 count = 4;
}

message Notice {
  // The same for the same cause ("fancyzones-shift-drag").
  string id = 1;
  string title = 2;
  string text = 3;
}

message MonitorOverlayData {
  // 1 was the handle as text; `output_id` replaced it.
  reserved 1;
  string name = 2;
  bool is_primary = 3;
  // Focused workspace, retained for compact consumers.
  WorkspaceOverlayData workspace = 4;
  Position position = 5;  // Monitor screen position
  Size size = 6;          // Monitor screen size
  Position work_position = 7;
  Size work_size = 8;
  int32 reserved_left = 9;
  int32 reserved_top = 10;
  int32 reserved_right = 11;
  int32 reserved_bottom = 12;
  // Every materialized workspace in WM ring order.
  repeated WorkspaceOverlayData workspaces = 13;
  uint32 active_workspace_id = 14;
  bool is_focused = 15;
  // As in MonitorInfo.
  uint64 output_id = 16;
  string connector = 17;
  // Where the bar belongs on this monitor; absent when there is none.
  Position bar_position = 18;
  Size bar_size = 19;
  // Device pixels per logical pixel. 0 from a WM that does not say.
  double scale = 20;
  // The refresh rate now, in thousandths of a hertz; 0 when not known.
  int32 refresh_millihertz = 21;
  // The modes the display offers, where the WM sets them (Linux on
  // hardware). Empty where it does not.
  repeated OutputModeInfo modes = 22;
  // As in MonitorInfo.
  string stable_id = 23;
  // How much of what the work area leaves free at each side is the room
  // the shell's zones keep (those that reserve), as it was taken off for
  // this very work area, in its units. The rest of the room at a side is
  // the panel's and the system's. Absent or all 0: none.
  Sides zones_room = 24;
}

// One mode a display offers.
message OutputModeInfo {
  int32 width = 1;
  int32 height = 2;
  int32 refresh_millihertz = 3;
  // The one the display asks for.
  bool preferred = 4;
  // The one it is in.
  bool current = 5;
}

message WorkspaceOverlayData {
  uint32 id = 1;
  string name = 2;
  string layout_type = 3;
  uint32 total_windows = 4;
  uint32 tiled_windows = 5;
  uint32 floating_windows = 6;
  uint32 container_count = 7;
  repeated WindowInfo windows = 8;
  repeated DetailedWindowInfo detailed_windows = 9;  // Detailed window information
  string master_position = 10;
  string new_window_placement = 11;
  bool tiling_enabled = 12;
  bool float_override = 13;
  // Per-workspace window container behaviour: "Column" or "Append".
  string window_container_behaviour = 14;
  // What is shown of it: its title, or its name where it has none. (`name`
  // is what it is known by to keys, rules and commands, and does not
  // change when it is renamed.)
  string title = 15;
  // The configuration has an entry for it on its display.
  bool configured = 16;
  // It stays when it is left empty.
  bool persistent = 17;
}

message DetailedWindowInfo {
  uint64 window_id = 1;
  string title = 2;
  string class = 3;
  string exe = 4;
  Position position = 5;
  Size size = 6;
  bool is_focused = 7;
  bool is_minimized = 8;
  bool is_maximized = 9;
  bool is_managed = 10;        // Whether window is managed by WM
  bool is_tiled = 11;          // Window is in tiling layout (not floating)
  bool is_floating = 12;       // Window is floating
  bool has_border = 13;        // Window has decorative border
  bool is_border_window = 14;  // This IS a border window (internal)
  uint32 workspace_id = 15;    // Which workspace contains this window
  repeated string tags = 16;
  repeated string matched_rules = 17;
  repeated string effective_rule_effects = 18;
  uint32 effective_opacity = 19;
  bool is_dimmed = 20;
  string shadow_policy = 21;
  string app_id = 22; // see WindowInfo.app_id
  // The picture the window's program gave this window itself: a name out
  // of the icon theme, or the path of a file of its pixels. Empty where
  // it gave none (the window's picture is then its program's).
  string icon = 23;
  // It is kept above the other windows (always on top).
  bool is_always_on_top = 24;
}

// ============================================================================
// Zones (the shell's containers for the desktop's icons)
// ============================================================================
//
// The JSON in these messages is gevrek-zones' (`gevrek_zones::ipc`), under
// its own version number: its shapes still move, and these messages need
// not change when they do.

// What the shell that runs the zones tells the window manager.
message ZonesReport {
  oneof report {
    ZonesSnapshotReport snapshot = 1;
    ZonesEventReport event = 2;
    ZonesCommandAnswer answer = 3;
  }
}

// The zones as they are: `gevrek_zones::ipc::ZonesSnapshot` as JSON.
message ZonesSnapshotReport {
  // The version of the JSON (`gevrek_zones::ipc::VERSION`).
  uint32 version = 1;
  string json = 2;
}

// Something happened to the zones: a `gevrek_zones::ZonesEvent` as JSON.
// Subscribers are told as a `runtime_event` of the kind `zones.<name>`.
message ZonesEventReport {
  uint32 version = 1;
  // The event's own word (`zone_created`).
  string name = 2;
  string json = 3;
}

// The shell's answer to a `ZonesRequest` that had a `request_id`.
message ZonesCommandAnswer {
  uint64 request_id = 1;
  bool success = 2;
  // Why it was refused, in the zones' own words.
  optional string error = 3;
  // What happened because of it: `ZonesEvent`s as JSON, in their order.
  repeated string events = 4;
}

// Something asked of the zones, sent to the shell that runs them.
message ZonesRequest {
  // Echoed in the answer. 0: nobody waits, and nothing is to be answered.
  uint64 request_id = 1;
  uint32 version = 2;
  // A zones command (`{"command": "quick_hide"}`).
  string json = 3;
}

// What of the zones' state is asked for. Empty asks for all of it, and
// is what an older client sends (it sent `Empty`).
message ZonesStateRequest {
  // Leave the items out: each zone keeps its `item_count`, the loose
  // items become `loose_count`. A desktop of thousands of items makes a
  // snapshot of a megabyte, and a status bar wants the zones only.
  bool without_items = 1;
  // Only this zone, by its id, with its items (unless they are left
  // out). The other zones are not in the answer; one that is not there
  // leaves `zones` empty.
  string zone = 2;
}

message ZonesStateResponse {
  // A shell that runs the zones is attached now.
  bool running = 1;
  // `json` is from a shell that has gone since, or from before the shell
  // that is attached now has reported anything.
  bool stale = 2;
  uint32 version = 3;
  // Counts up with every snapshot this window manager was given; 0 while
  // there never was one (`json` is empty then).
  uint64 sequence = 4;
  string json = 5;
  // When the snapshot came, in milliseconds since 1970.
  int64 published_ms = 6;
  // In words, where there is nothing to show or it is old.
  string message = 7;
}

message ZonesCommandDocument {
  // A zones command (`{"command": "quick_hide"}`).
  string json = 1;
  uint32 version = 2;
  // How long to wait for the shell's answer; 0: the window manager's own
  // time (5 s). Never more than 30 s.
  uint32 timeout_ms = 3;
}

message ZonesCommandReply {
  // The shell carried it out.
  bool success = 1;
  // Why not: the zones' own reason, that no shell runs the zones, or that
  // none answered in time.
  optional string error = 2;
  // What happened because of it: `ZonesEvent`s as JSON, in their order.
  repeated string events = 3;
  // A shell that runs the zones was attached and was sent the command.
  bool delivered = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LEFT = 1;
  DIRECTION_RIGHT = 2;
  DIRECTION_UP = 3;
  DIRECTION_DOWN = 4;
}

message DispatchRequest {
  DispatchType command = 1;
  Direction direction = 2;
  // Numeric dispatcher arguments. Pixel delta for move/resize/gap,
  // thousandths for layout ratio, and an integer for master count.
  int32 x = 3;
  int32 y = 4;
  // Dispatcher-specific text: scratchpad ID, layout name, Dwindle direction,
  // window tag, named rule, workspace selector, or monitor selector.
  // Monitor selectors: primary, index, name:<name>, next, or previous.
  // Resize-edge/axis sizing ("increase"/"decrease") and flip/resize axis
  // ("horizontal"/"vertical"/"horizontal-and-vertical") also travel here.
  // Save/load-resize file paths travel here as well. Work-area offsets
  // travel as comma-separated "left,top,right,bottom". NewWorkspace's
  // optional name travels here; EnsureWorkspaces carries the monitor
  // selector here with the count in x, and EnsureNamedWorkspace carries the
  // monitor selector here with the workspace name in secondary_argument.
  string argument = 5;
  // A second textual argument for typed commands such as workspace rename.
  string secondary_argument = 6;
}

message CommandDocument {
  string json = 1;
}

message DispatchBatchRequest {
  repeated DispatchRequest requests = 1;
  bool stop_on_error = 2;
}

message DispatchBatchItemResult {
  uint32 index = 1;
  bool success = 2;
  bool skipped = 3;
  optional string error = 4;
}

message DispatchBatchResponse {
  bool success = 1;
  repeated DispatchBatchItemResult results = 2;
}

message HealthStatus {
  bool healthy = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  optional string message = 4;
}

message DispatcherCapability {
  int32 value = 1;
  string id = 2;
  string display_name = 3;
  string argument_kind = 4;
}

message CapabilitiesResponse {
  string server_version = 1;
  string protocol_version = 2;
  uint32 config_schema_version = 3;
  string platform = 4;
  repeated string features = 5;
  repeated DispatcherCapability dispatchers = 6;
  repeated string node_types = 7;
  // The backend that runs: "win32" or "smithay".
  string backend = 8;
}

// ============================================================================
// Node Graph Structure
// ============================================================================

message NodeGraph {
  // Legacy per-node encoding. No longer written or read: the graph travels
  // as `json`. Kept so old field numbers are not reused.
  repeated Node nodes = 1;
  repeated Connection connections = 2;
  string version = 3;
  string editor_id = 4; // ID of the editor that created/modified this graph
  // ID allocation counters. They can exceed max(id) + 1 after deletions;
  // carrying them keeps new IDs from reusing deleted ones across a round trip.
  uint64 next_node_id = 5;
  uint64 next_pin_id = 6;
  // The graph as the serde JSON used in the configuration file. An empty
  // string means "no graph" (PushGraph then applies the working graph).
  string json = 8;
  // Sizes of the graph in `json`, for logs and listings.
  uint32 node_count = 9;
  uint32 connection_count = 10;
  // PushGraph: the configuration revision the graph was edited from. The WM
  // refuses the push if it runs a different revision; 0 pushes
  // unconditionally (scripts, the CLI).
  uint64 base_revision = 11;
}

message Node {
  string id = 1;
  NodeType type = 2;
  Position position = 3;
  repeated Pin input_pins = 4;
  repeated Pin output_pins = 5;
  optional NodeData data = 6;
}

message Position {
  float x = 1;
  float y = 2;
}

message Pin {
  string id = 1;
  string name = 2;
  PinType type = 3;
  PinKind kind = 4;
  optional string value = 5; // JSON-serialized value
}

message Connection {
  string from_node = 1;
  string from_pin = 2;
  string to_node = 3;
  string to_pin = 4;
}

// Node-specific data (for value nodes, etc.)
message NodeData {
  // JSON-serialized field values. `node_json` holds the complete serde JSON
  // of the node type and is authoritative when present; the per-field keys
  // remain for older readers.
  map<string, string> fields = 1;
}


[package]
name = "gevrek-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test helpers (e.g. `Outputs::add_test_monitor`) for crates that test
# against the engine.
test-support = []

[dependencies]
gevrek-model = { path = "../model" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
regex = { workspace = true }

# What the engine does most, timed (`benches/engine.rs` says how).
[[bench]]
name = "engine"
harness = false
required-features = ["test-support"]

# Which backend answers which portal in a gevrek session
# (xdg-desktop-portal reads the file named after XDG_CURRENT_DESKTOP).
# gevrek's own backend takes over portal by portal as it is written.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gevrek
org.freedesktop.impl.portal.Notification=gevrek
org.freedesktop.impl.portal.Wallpaper=gevrek
org.freedesktop.impl.portal.Inhibit=gevrek
org.freedesktop.impl.portal.ScreenCast=gevrek
org.freedesktop.impl.portal.Screenshot=gevrek
org.freedesktop.impl.portal.RemoteDesktop=gevrek
org.freedesktop.impl.portal.Background=gevrek
org.freedesktop.impl.portal.GlobalShortcuts=gevrek
org.freedesktop.impl.portal.Secret=gnome-keyring
